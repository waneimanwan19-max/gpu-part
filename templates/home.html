{% extends "base.html" %}

{% block body %}

<div class="two-column">

    {% for gpu in results %}

    <div class="w3-card-4">

        <h2>{{ gpu[1] }} {{ gpu[2] }}</h2>

        <a href="{{ url_for('gpu_page', gpu_id=gpu[0]) }}">
            <img
                src="{{ url_for('static', filename='images/' ~ gpu[7]) }}"
                alt="{{ gpu[1] }} {{ gpu[2] }}"
                class="gpu-image"
            >
        </a>

    </div>

    {% endfor %}
{% endblock %}
